name: Backend performance checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://orbit:orbit_test_password@localhost:5432/orbit_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_test_password
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8"

      - name: Compile changed backend modules
        run: |
          python -m py_compile \
            server.py agent.py memory_store.py mcp_client.py \
            qdrant_vector.py chat_store.py credential_vault.py \
            policy_engine.py proactive_engine.py proactive_integrations.py

      - name: Run approval, vault, integration and performance tests
        run: |
          python -m pytest -q -rs \
            test_backend_performance.py \
            test_security_hardening.py \
            test_proactive_integrations.py \
            test_proactive_api.py \
            test_rotation.py
