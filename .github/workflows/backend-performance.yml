name: Backend performance checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8" \
            "httpx>=0.27.0" \
            "python-dotenv>=1.0.0" \
            "psycopg[binary,pool]>=3.2" \
            "qdrant-client>=1.9.0" \
            "langgraph>=0.2.0" \
            "langgraph-checkpoint-postgres>=2.0.0" \
            "cryptography>=42.0.0"

      - name: Compile changed backend modules
        run: |
          python -m py_compile \
            server.py agent.py memory_store.py mcp_client.py \
            qdrant_vector.py chat_store.py credential_vault.py \
            policy_engine.py proactive_engine.py

      - name: Run focused performance and session tests
        run: python -m pytest -q -rs test_backend_performance.py test_rotation.py test_security_hardening.py
